    - $TELINK_IDE_BUILD -data ${CI_PIPELINE_ID}_WS_TL752X  -import tlk_bluetooth_src/build/TL752X -cleanBuild TL752X_tlk_bluetooth_src/btbletpsll_headset
    - $TELINK_IDE_BUILD -data ${CI_PIPELINE_ID}_WS_TL752X  -import tlk_bluetooth_src/build/TL752X -cleanBuild TL752X_tlk_bluetooth_src/controller
